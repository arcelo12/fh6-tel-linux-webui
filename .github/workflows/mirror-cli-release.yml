name: FH6 Telemetry Mirror (CLI/TUI) - Release

on:
  push:
    tags:
      - 'mirror-cli-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0.0)'
        required: true
        default: '1.0.0'

jobs:
  build-and-release:
    name: Build & Release (All Platforms)
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true
          cache-dependency-path: fh6-tel-mirror/go.sum

      # ─── Resolve version ─────────────────────────────────────────────────
      - name: Resolve release version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            # Strip "mirror-cli-v" prefix from tag
            VERSION="${GITHUB_REF_NAME#mirror-cli-v}"
          else
            VERSION="${{ inputs.version }}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "🔖 Building version: $VERSION"

      # ─── Build all platforms (Go cross-compile from one Linux runner) ────
      - name: Build all platform binaries
        working-directory: fh6-tel-mirror
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          BINARY="fh6-tel-mirror"
          DIST="dist"
          LDFLAGS="-s -w -X main.version=$VERSION"

          mkdir -p "$DIST"

          echo "📦 Building Linux amd64..."
          CGO_ENABLED=0 GOOS=linux   GOARCH=amd64 go build -ldflags="$LDFLAGS" -o "$DIST/${BINARY}-linux-amd64"       .

          echo "📦 Building Linux arm64..."
          CGO_ENABLED=0 GOOS=linux   GOARCH=arm64 go build -ldflags="$LDFLAGS" -o "$DIST/${BINARY}-linux-arm64"       .

          echo "📦 Building Windows amd64..."
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags="$LDFLAGS" -o "$DIST/${BINARY}-windows-amd64.exe" .

          echo "📦 Building Windows arm64..."
          CGO_ENABLED=0 GOOS=windows GOARCH=arm64 go build -ldflags="$LDFLAGS" -o "$DIST/${BINARY}-windows-arm64.exe" .

          echo "📦 Building macOS amd64..."
          CGO_ENABLED=0 GOOS=darwin  GOARCH=amd64 go build -ldflags="$LDFLAGS" -o "$DIST/${BINARY}-darwin-amd64"      .

          echo "📦 Building macOS arm64 (Apple Silicon)..."
          CGO_ENABLED=0 GOOS=darwin  GOARCH=arm64 go build -ldflags="$LDFLAGS" -o "$DIST/${BINARY}-darwin-arm64"      .

          echo ""
          echo "✅ All binaries built:"
          ls -lh "$DIST/"

      # ─── Bundle config file alongside binaries ──────────────────────────
      - name: Bundle default config
        working-directory: fh6-tel-mirror
        run: cp mirror_config.json dist/mirror_config.json

      # ─── Compress Linux & macOS binaries ─────────────────────────────────
      - name: Compress binaries with UPX (Linux & macOS)
        continue-on-error: true
        run: |
          sudo apt-get install -y upx-ucl
          upx --best fh6-tel-mirror/dist/fh6-tel-mirror-linux-amd64  || true
          upx --best fh6-tel-mirror/dist/fh6-tel-mirror-linux-arm64   || true

      # ─── Create GitHub Release ───────────────────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mirror-cli-v${{ steps.version.outputs.version }}
          name: "🏁 FH6 Telemetry Mirror CLI v${{ steps.version.outputs.version }}"
          draft: false
          prerelease: false
          body: |
            ## 🏁 FH6 Telemetry Mirror CLI v${{ steps.version.outputs.version }}

            **Native CLI/TUI middleware** untuk menduplikasi aliran telemetri UDP Forza Horizon ke beberapa endpoint secara bersamaan.  
            Tidak memerlukan instalasi, GUI, atau dependensi runtime — langsung jalankan binary-nya.

            ---

            ### 📦 Download Binary

            | Platform | Arsitektur | File |
            |----------|-----------|------|
            | 🪟 Windows | x86_64 (64-bit) | `fh6-tel-mirror-windows-amd64.exe` |
            | 🪟 Windows | ARM64 | `fh6-tel-mirror-windows-arm64.exe` |
            | 🐧 Linux | x86_64 (64-bit) | `fh6-tel-mirror-linux-amd64` |
            | 🐧 Linux | ARM64 (Pi, dll) | `fh6-tel-mirror-linux-arm64` |
            | 🍎 macOS | Apple Silicon (M1/M2) | `fh6-tel-mirror-darwin-arm64` |
            | 🍎 macOS | Intel | `fh6-tel-mirror-darwin-amd64` |

            > Unduh juga `mirror_config.json` dan taruh di folder yang sama dengan binary.

            ---

            ### 🚀 Cara Penggunaan

            **Windows** — Buka Command Prompt / PowerShell di folder download:
            ```cmd
            fh6-tel-mirror-windows-amd64.exe
            ```

            **Linux / macOS** — Beri izin eksekusi lalu jalankan:
            ```bash
            chmod +x fh6-tel-mirror-linux-amd64
            ./fh6-tel-mirror-linux-amd64
            ```

            ---

            ### ⌨️ Kontrol TUI

            | Tombol | Fungsi |
            |--------|--------|
            | `A` | Tambah node tujuan baru |
            | `T` | Toggle aktif/nonaktif node |
            | `D` | Hapus node |
            | `P` | Ubah port UDP inbound |
            | `Q` | Keluar dari aplikasi |

            ---

            ### 🎮 Pengaturan Forza Horizon 6

            **Settings → HUD and Gameplay → Data Out:**
            - **Data Out**: `ON`
            - **Data Out IP Address**: `127.0.0.1`
            - **Data Out IP Port**: `20440`
            - **Data Out Packet Format**: `Car Dash`
          files: |
            fh6-tel-mirror/dist/fh6-tel-mirror-linux-amd64
            fh6-tel-mirror/dist/fh6-tel-mirror-linux-arm64
            fh6-tel-mirror/dist/fh6-tel-mirror-windows-amd64.exe
            fh6-tel-mirror/dist/fh6-tel-mirror-windows-arm64.exe
            fh6-tel-mirror/dist/fh6-tel-mirror-darwin-amd64
            fh6-tel-mirror/dist/fh6-tel-mirror-darwin-arm64
            fh6-tel-mirror/dist/mirror_config.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
