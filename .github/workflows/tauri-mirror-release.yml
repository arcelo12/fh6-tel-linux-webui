name: FH6 Telemetry Mirror Hub - Release

on:
  push:
    tags:
      - 'mirror-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0.0)'
        required: true
        default: '1.0.0'

jobs:
  build-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # ─── Windows x86_64 ───────────────────────────────────────────────
          - platform: 'windows-latest'
            args: '--target x86_64-pc-windows-msvc'
            os-name: 'windows-x86_64'

          # ─── Linux x86_64 ─────────────────────────────────────────────────
          - platform: 'ubuntu-22.04'
            args: '--target x86_64-unknown-linux-gnu'
            os-name: 'linux-x86_64'

          # ─── macOS Apple Silicon ──────────────────────────────────────────
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
            os-name: 'macos-arm64'

          # ─── macOS Intel ──────────────────────────────────────────────────
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
            os-name: 'macos-x86_64'

    runs-on: ${{ matrix.platform }}
    name: Build (${{ matrix.os-name }})

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ─── Rust Setup ────────────────────────────────────────────────────────
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './fh6-tel-mirror-tauri/src-tauri -> target'

      # ─── Linux System Dependencies ────────────────────────────────────────
      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.0-dev \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libglib2.0-dev

      # ─── Node.js Setup ─────────────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: fh6-tel-mirror-tauri/package-lock.json

      - name: Install Node.js dependencies
        working-directory: fh6-tel-mirror-tauri
        run: npm ci

      # ─── Build & Release ───────────────────────────────────────────────────
      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: fh6-tel-mirror-tauri
          tagName: mirror-v__VERSION__
          releaseName: 'FH6 Telemetry Mirror Hub v__VERSION__'
          releaseBody: |
            ## 🏁 FH6 Telemetry Mirror Hub v__VERSION__

            High-performance native GUI for mirroring Forza Horizon telemetry UDP streams to multiple endpoints simultaneously.

            ### ✨ Features
            - Real-time stats dashboard (RX/TX packets, PPS, latency)
            - Add/toggle/delete mirror destinations
            - UDP rate throttling: 60Hz / 30Hz / 20Hz / 10Hz
            - Config persistence via `mirror_config.json`
            - Native desktop app (no browser required)

            ### 📦 Downloads
            | Platform | File |
            |----------|------|
            | Windows (x64) | `FH6.Telemetry.Mirror.Hub_*_x64-setup.exe` (NSIS Installer) |
            | Linux (x64) | `fh6-telemetry-mirror-hub_*_amd64.deb` |
            | macOS (Apple Silicon) | `FH6.Telemetry.Mirror.Hub_*_aarch64.dmg` |
            | macOS (Intel) | `FH6.Telemetry.Mirror.Hub_*_x64.dmg` |

            ### 🔧 Installation Notes
            **Windows**: Run the NSIS `.exe` installer (installs per-user, no admin needed).  
            **Linux**: `sudo dpkg -i *.deb` or extract AppImage directly.  
            **macOS**: Mount `.dmg` and drag to Applications.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
