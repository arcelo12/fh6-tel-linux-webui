name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 1.0.0)'
        required: true

jobs:
  release:
    permissions:
      contents: write
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Bump version and tag
        shell: bash
        run: |
          CURRENT=$(node -p "require('./package.json').version")
          if [ "$CURRENT" != "${{ inputs.version }}" ]; then
            node -e "
              const fs = require('fs');
              const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
              p.version = '${{ inputs.version }}';
              fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
            "
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add package.json
            git commit -m "chore: release v${{ inputs.version }}"
            git push origin HEAD
          else
            echo "Version already ${{ inputs.version }}, skipping bump commit"
          fi
          git tag "v${{ inputs.version }}" 2>/dev/null || echo "Tag already exists locally"
          git push origin "v${{ inputs.version }}" 2>/dev/null || echo "Tag already exists on remote"

      - name: Install dependencies
        run: npm install

      - name: Build Svelte & compile Go binaries
        run: go run scripts/build_release.go

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: FH6 Telemetry v${{ inputs.version }}
          body: |
            ## FH6 Telemetry Release v${{ inputs.version }}

            Self-contained binaries for Forza Horizon 6 Telemetry Dashboard.
            No external assets or installations required! Just download and run the binary for your platform.

            ### Setup Forza Horizon 6:
            1. Go to **Settings → HUD and Gameplay**
            2. Scroll down to **Data Out**
            3. Set **Data Out** to **On**
            4. Set **Data Out IP Address** to your PC's IP (or `127.0.0.1` if running on the same PC)
            5. Set **Data Out IP Port** to `20440` (default)
          draft: false
          prerelease: false
          files: |
            dist/fh6-telemetry-multi-windows-amd64.exe
            dist/fh6-telemetry-multi-linux-amd64
            dist/fh6-telemetry-multi-darwin-amd64
            dist/fh6-telemetry-multi-darwin-arm64
            dist/fh6-telemetry-solo-windows-amd64.exe
            dist/fh6-telemetry-solo-linux-amd64
            dist/fh6-telemetry-solo-darwin-amd64
            dist/fh6-telemetry-solo-darwin-arm64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
